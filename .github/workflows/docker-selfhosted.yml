# Build & push self-hosted Docker image (linux/amd64)
# Manual trigger via Actions UI or: gh workflow run docker-selfhosted.yml
# Image: ghcr.io/<owner>/axonhub:<version> and :latest
# Version is read from internal/build/VERSION (e.g. v1.0.0-beta8+azusa.v0.1).
# Docker tags disallow '+', so it is mapped to '_' (e.g. v1.0.0-beta8_azusa.v0.1).

name: Build self-hosted Docker image

on:
  workflow_dispatch:

jobs:
  build-amd64:
    name: Build & push (linux/amd64)
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Read version from VERSION file
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < internal/build/VERSION)
          DOCKER_TAG=$(printf '%s' "$VERSION" | sed 's/+/_/g')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "docker_tag=$DOCKER_TAG" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION (docker tag: $DOCKER_TAG)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.docker_tag }}
            type=raw,value=latest

      - name: Build & push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
