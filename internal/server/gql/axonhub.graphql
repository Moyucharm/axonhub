extend type Channel {
  """
  Built-in endpoints resolved dynamically from the channel type.
  The first item is the primary endpoint.
  These are displayed to users but are not directly editable.
  """
  defaultEndpoints: [ChannelEndpoint!]! @goField(forceResolver: true)

  """
  All model entries this channel can handle, including direct models, prefixed models, auto-trimmed models, and mapped models
  """
  allModelEntries: [ChannelModelEntry!]! @goField(forceResolver: true)

  """
  Channel credentials, will be null if user can not access the the credentials
  """
  credentials: ChannelCredentials @goField(forceResolver: true)

  """
  Disabled API keys for this channel. Sensitive: will be null if user can not access.
  """
  disabledAPIKeys: [DisabledAPIKey!] @goField(forceResolver: true)

  """
  Full upstream error text captured when the channel entered cooldown.
  """
  cooldownErrorMessage: String @goField(forceResolver: true)

  """
  Upstream status code captured when the channel entered cooldown.
  """
  cooldownErrorCode: Int @goField(forceResolver: true)

  """
  Real-time per-channel concurrency limiter snapshot. Returns null when the channel
  has no MaxConcurrent configured (no admission control).
  """
  liveLimiterStats: ChannelLimiterStats @goField(forceResolver: true)
}

"""
ChannelLimiterStats is a point-in-time snapshot of the per-channel concurrency limiter.
"""
type ChannelLimiterStats {
  """
  Number of requests currently holding a capacity slot.
  """
  inFlight: Int!
  """
  Number of requests currently waiting in the FIFO queue.
  """
  waiting: Int!
  """
  Configured MaxConcurrent (capacity ceiling).
  """
  capacity: Int!
  """
  Configured QueueSize (0 means soft mode — no waiting queue, only counts).
  """
  queueSize: Int!
}

