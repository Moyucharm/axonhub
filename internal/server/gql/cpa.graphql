enum CPAConnectionStatus {
  connected
  disabled
  error
  unknown
}

enum CPAQuotaState {
  pending
  success
  error
  unsupported
  insufficient_data
}

enum CPACredentialFilterStatus {
  enabled
  disabled
  abnormal
  cooldown
}

type CPAManagedInstance {
  id: Int!
  name: String!
  baseURL: String!
  enabled: Boolean!
  insecureSkipTLS: Boolean!
  autoRefreshEnabled: Boolean!
  refreshIntervalMinutes: Int!
  autoManageEnabled: Boolean!
  usageStreamEnabled: Boolean!
  enabledPatrolIntervalMinutes: Int!
  disabledPatrolIntervalMinutes: Int!
  nextRefreshAt: Time
  nextEnabledPatrolAt: Time
  nextDisabledPatrolAt: Time
  serverVersion: String!
  serverCommit: String!
  serverBuildDate: String!
  lastSyncAttemptAt: Time
  lastSyncSuccessAt: Time
  lastErrorAt: Time
  lastError: String
  hasSecret: Boolean!
  connectionStatus: CPAConnectionStatus!
  createdAt: Time!
  updatedAt: Time!
}

type CPAQuotaItem {
  id: String!
  group: String!
  label: String!
  description: String!
  usedPercent: Float
  remainingPercent: Float
  used: Float
  limit: Float
  remaining: Float
  unit: String!
  resetAt: Time
  periodSeconds: Int
  estimatedLimitUSD: Float
  estimatedCostUSD: Float
  estimateSource: String
}

type CPAQuotaSnapshot {
  items: [CPAQuotaItem!]!
}

type CPAManagedCredential {
  id: Int!
  instanceID: Int!
  remoteName: String!
  displayName: String!
  provider: String!
  email: String!
  status: String!
  statusMessage: String!
  disabled: Boolean!
  unavailable: Boolean!
  runtimeOnly: Boolean!
  priority: Int!
  planType: String!
  quotaState: CPAQuotaState!
  quotaData: CPAQuotaSnapshot!
  quotaLastAttemptAt: Time
  quotaLastSuccessAt: Time
  quotaLastFailureAt: Time
  quotaLastError: String!
  available: Boolean!
  abnormal: Boolean!
  stale: Boolean!
  expired: Boolean!
  cooling: Boolean!
  cooldownUntil: Time
  createdAt: Time!
  updatedAt: Time!
}

type CPACredentialEdge {
  cursor: String!
  node: CPAManagedCredential!
}

type CPAPageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type CPACredentialConnection {
  edges: [CPACredentialEdge!]!
  pageInfo: CPAPageInfo!
  totalCount: Int!
}

type CPACredentialStats {
  available: Int!
  total: Int!
  abnormal: Int!
}

type CPAProviderOverview {
  provider: String!
  count: Int!
  planTypes: [String!]!
}

type CPAOverview {
  stats: CPACredentialStats!
  providers: [CPAProviderOverview!]!
}

type CPARefreshResult {
  requested: Int!
  succeeded: Int!
  failed: Int!
  skipped: Int!
}

type CPARefreshProgress {
  requested: Int!
  completed: Int!
  succeeded: Int!
  failed: Int!
  skipped: Int!
  running: Boolean!
}

input CreateCPAInstanceInput {
  name: String!
  baseURL: String!
  managementSecret: String!
  enabled: Boolean
  insecureSkipTLS: Boolean!
  autoRefreshEnabled: Boolean
  refreshIntervalMinutes: Int
  autoManageEnabled: Boolean
  usageStreamEnabled: Boolean
  enabledPatrolIntervalMinutes: Int
  disabledPatrolIntervalMinutes: Int
}

input UpdateCPAInstanceInput {
  name: String
  baseURL: String
  managementSecret: String
  enabled: Boolean
  insecureSkipTLS: Boolean
  autoRefreshEnabled: Boolean
  refreshIntervalMinutes: Int
  autoManageEnabled: Boolean
  usageStreamEnabled: Boolean
  enabledPatrolIntervalMinutes: Int
  disabledPatrolIntervalMinutes: Int
}

input QueryCPACredentialsInput {
  instanceID: Int!
  first: Int!
  after: String
  search: String
  provider: String
  statuses: [CPACredentialFilterStatus!]!
  planTypes: [String!]!
  abnormalOnly: Boolean!
}

extend type Query {
  cpaInstances: [CPAManagedInstance!]!
  cpaInstance(id: Int!): CPAManagedInstance!
  queryCPACredentials(input: QueryCPACredentialsInput!): CPACredentialConnection!
  cpaOverview(instanceID: Int!): CPAOverview!
  cpaRefreshProgress(instanceID: Int!): CPARefreshProgress
}

extend type Mutation {
  createCPAInstance(input: CreateCPAInstanceInput!): CPAManagedInstance!
  updateCPAInstance(id: Int!, input: UpdateCPAInstanceInput!): CPAManagedInstance!
  deleteCPAInstance(id: Int!): Boolean!
  refreshCPAInstance(instanceID: Int!, provider: String): CPARefreshResult!
  refreshCPACredential(credentialID: Int!): CPAManagedCredential!
  toggleCPACredential(credentialID: Int!, disabled: Boolean!): CPAManagedCredential!
}
